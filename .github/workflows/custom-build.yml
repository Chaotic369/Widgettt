name: Custom Android Build

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Application Name"
        required: true
        default: "Chaotic Launcher"
      app_version:
        description: "Application Version"
        required: true
        default: "1.0.0"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clean Invalid Placeholder Binaries
        run: |
          rm -f "gradle/wrapper/gradle-wrapper.jar"
          if [ -f "app/src/main/res/drawable/widget_preview.png" ]; then
            if grep -q "PLACEHOLDER" "app/src/main/res/drawable/widget_preview.png"; then
              rm -f "app/src/main/res/drawable/widget_preview.png"
            fi
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          validate-wrappers: false

      - name: Inject Custom Build Icon
        run: |
          if [ -f "build-icon.png" ]; then
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              target_dir="app/src/main/res/mipmap-${density}"
              mkdir -p "${target_dir}"
              cp "build-icon.png" "${target_dir}/ic_launcher.png"
              cp "build-icon.png" "${target_dir}/ic_launcher_round.png"
            done
          fi

      - name: Patch App Name, Version, and Repair XML Resources
        env:
          INPUT_APP_NAME: ${{ github.event.inputs.app_name || 'Chaotic Launcher' }}
          INPUT_APP_VERSION: ${{ github.event.inputs.app_version || '1.0.0' }}
        run: |
          python3 - << 'EOF'
          import os
          import re
          from xml.sax.saxutils import escape

          app_name = os.environ.get("INPUT_APP_NAME", "Chaotic Launcher")
          app_version = os.environ.get("INPUT_APP_VERSION", "1.0.0")
          escaped_name = escape(app_name, {'"': '&quot;', "'": '&apos;'})

          has_custom_icon = os.path.exists("build-icon.png")
          icon_ref = "@mipmap/ic_launcher" if has_custom_icon else "@drawable/ic_launcher_foreground"
          round_icon_ref = "@mipmap/ic_launcher_round" if has_custom_icon else "@drawable/ic_launcher_foreground"

          manifest_xml = f'''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:icon="{icon_ref}"
                  android:label="{escaped_name}"
                  android:roundIcon="{round_icon_ref}"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.CustomTextWidget">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".WidgetConfigActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_CONFIGURE" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".widget.CustomTextWidgetProvider"
                      android:exported="true"
                      android:label="@string/widget_name">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/custom_text_widget_info" />
                  </receiver>

              </application>

          </manifest>
          '''

          os.makedirs("app/src/main", exist_ok=True)
          with open("app/src/main/AndroidManifest.xml", "w", encoding="utf-8") as f:
              f.write(manifest_xml.strip() + "\n")

          widget_info_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:configure="com.custom.textwidget.WidgetConfigActivity"
              android:description="@string/widget_desc"
              android:initialLayout="@layout/widget_canvas_layout"
              android:minWidth="110dp"
              android:minHeight="60dp"
              android:minResizeWidth="60dp"
              android:minResizeHeight="40dp"
              android:resizeMode="horizontal|vertical"
              android:targetCellWidth="3"
              android:targetCellHeight="2"
              android:updatePeriodMillis="0"
              android:widgetCategory="home_screen"
              android:widgetFeatures="reconfigurable" />
          '''
          os.makedirs("app/src/main/res/xml", exist_ok=True)
          with open("app/src/main/res/xml/custom_text_widget_info.xml", "w", encoding="utf-8") as f:
              f.write(widget_info_xml.strip() + "\n")

          strings_xml = f'''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">{escaped_name}</string>
              <string name="widget_name">Custom Text Widget</string>
              <string name="widget_desc">Fully customizable text widget with custom shapes, fonts, placement, and background transparency.</string>
          </resources>
          '''
          os.makedirs("app/src/main/res/values", exist_ok=True)
          with open("app/src/main/res/values/strings.xml", "w", encoding="utf-8") as f:
              f.write(strings_xml.strip() + "\n")

          gradle_path = "app/build.gradle.kts"
          if os.path.exists(gradle_path):
              with open(gradle_path, "r", encoding="utf-8") as f:
                  gradle_content = f.read()

              digits = [int(x) for x in re.findall(r'\d+', app_version)]
              if len(digits) >= 3:
                  version_code = digits[0] * 10000 + digits[1] * 100 + digits[2]
              elif len(digits) == 2:
                  version_code = digits[0] * 10000 + digits[1] * 100
              elif len(digits) == 1:
                  version_code = digits[0]
              else:
                  version_code = 1
              version_code = max(1, version_code)

              gradle_content = re.sub(
                  r'versionCode\s*=\s*\d+',
                  f'versionCode = {version_code}',
                  gradle_content
              )
              gradle_content = re.sub(
                  r'versionName\s*=\s*"[^"]*"',
                  f'versionName = "{app_version}"',
                  gradle_content
              )

              with open(gradle_path, "w", encoding="utf-8") as f:
                  f.write(gradle_content)
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name || 'Chaotic Launcher' }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error