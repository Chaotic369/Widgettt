name: Custom Android Build

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Application Name"
        required: true
        default: "Chaotic Launcher"
      app_version:
        description: "Application Version"
        required: true
        default: "1.0.0"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Clean Invalid Placeholder Binaries
        run: |
          if [ -f "app/src/main/res/drawable/widget_preview.png" ]; then
            if grep -q "PLACEHOLDER" "app/src/main/res/drawable/widget_preview.png"; then
              rm -f "app/src/main/res/drawable/widget_preview.png"
            fi
          fi

      - name: Patch App Name and Version
        env:
          INPUT_APP_NAME: ${{ github.event.inputs.app_name || 'Chaotic Launcher' }}
          INPUT_APP_VERSION: ${{ github.event.inputs.app_version || '1.0.0' }}
        run: |
          python3 - << 'EOF'
          import os
          import re
          from xml.sax.saxutils import escape

          app_name = os.environ.get("INPUT_APP_NAME", "Chaotic Launcher")
          app_version = os.environ.get("INPUT_APP_VERSION", "1.0.0")
          escaped_name = escape(app_name, {'"': '&quot;', "'": '&apos;'})

          manifest_path = "app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  manifest = f.read()
              manifest = re.sub(
                  r'(<application\b[^>]*?\bandroid:label=")[^"]*(")',
                  rf'\g<1>{escaped_name}\2',
                  manifest,
                  count=1,
                  flags=re.DOTALL
              )
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(manifest)

          strings_path = "app/src/main/res/values/strings.xml"
          if os.path.exists(strings_path):
              with open(strings_path, "r", encoding="utf-8") as f:
                  strings_xml = f.read()
              strings_xml = re.sub(
                  r'(<string\s+name="app_name">)[^<]*(</string>)',
                  rf'\g<1>{escaped_name}\2',
                  strings_xml
              )
              with open(strings_path, "w", encoding="utf-8") as f:
                  f.write(strings_xml)

          gradle_path = "app/build.gradle.kts"
          if os.path.exists(gradle_path):
              with open(gradle_path, "r", encoding="utf-8") as f:
                  gradle_content = f.read()

              digits = [int(x) for x in re.findall(r'\d+', app_version)]
              if len(digits) >= 3:
                  version_code = digits[0] * 10000 + digits[1] * 100 + digits[2]
              elif len(digits) == 2:
                  version_code = digits[0] * 10000 + digits[1] * 100
              elif len(digits) == 1:
                  version_code = digits[0]
              else:
                  version_code = 1
              version_code = max(1, version_code)

              gradle_content = re.sub(
                  r'versionCode\s*=\s*\d+',
                  f'versionCode = {version_code}',
                  gradle_content
              )
              gradle_content = re.sub(
                  r'versionName\s*=\s*"[^"]*"',
                  f'versionName = "{app_version}"',
                  gradle_content
              )

              with open(gradle_path, "w", encoding="utf-8") as f:
                  f.write(gradle_content)
          EOF

      - name: Inject Custom Build Icon
        run: |
          if [ -f "build-icon.png" ]; then
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              target_dir="app/src/main/res/mipmap-${density}"
              mkdir -p "${target_dir}"
              cp "build-icon.png" "${target_dir}/ic_launcher.png"
              cp "build-icon.png" "${target_dir}/ic_launcher_round.png"
            done
            python3 - << 'EOF'
          import os
          import re
          manifest_path = "app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  content = f.read()
              content = re.sub(r'android:icon="[^"]*"', 'android:icon="@mipmap/ic_launcher"', content)
              content = re.sub(r'android:roundIcon="[^"]*"', 'android:roundIcon="@mipmap/ic_launcher_round"', content)
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(content)
          EOF
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name || 'Chaotic Launcher' }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error